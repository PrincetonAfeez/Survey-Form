<div class="mb-7">
  <div class="mb-2 flex items-center justify-between text-sm">
    <span class="font-medium text-slate-700 dark:text-slate-200">Question {{ step }} of <span class="text-slate-500 dark:text-slate-400">~{{ total }}</span></span>
    <span class="text-slate-500 dark:text-slate-400">{{ progress_percent }}%</span>
  </div>
  <div
    class="h-2 rounded-full bg-slate-100 dark:bg-slate-800"
    role="progressbar"
    aria-valuenow="{{ progress_percent }}"
    aria-valuemin="0"
    aria-valuemax="100"
    aria-label="Survey progress, {{ progress_percent }} percent complete"
  >
    <div class="h-2 rounded-full bg-teal-700 transition-all" style="width: {{ progress_percent }}%"></div>
  </div>
</div>
