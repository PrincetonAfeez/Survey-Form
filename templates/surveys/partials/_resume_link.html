{% if resume_url %}
  <div class="mt-8 border-t border-slate-200 pt-5 dark:border-slate-800">
    <label for="resume-link" class="text-sm font-medium text-slate-600 dark:text-slate-300">Resume link</label>
    <div class="mt-2 flex flex-col gap-2 sm:flex-row">
      <input id="resume-link" readonly value="{{ resume_url }}" class="min-w-0 flex-1 rounded-md border border-slate-300 bg-slate-50 px-3 py-2 text-sm text-slate-700 dark:border-slate-700 dark:bg-slate-950 dark:text-slate-200">
      <button type="button" data-copy-target="#resume-link" aria-label="Copy resume link to clipboard" class="rounded-md border border-slate-300 px-4 py-2 text-sm font-semibold text-slate-700 hover:bg-slate-100 focus:outline-none focus-visible:ring-2 focus-visible:ring-teal-600 dark:border-slate-700 dark:text-slate-200 dark:hover:bg-slate-800">Copy</button>
    </div>
  </div>
{% endif %}
