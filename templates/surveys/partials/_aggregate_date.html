<section class="rounded-lg border border-slate-200 bg-white p-5 dark:border-slate-800 dark:bg-slate-900">
  <h2 class="text-lg font-semibold">{{ aggregate.question.text }}</h2>
  <div class="mt-4 space-y-3">
    {% for row in aggregate.rows %}
      <div class="flex items-center justify-between rounded-md bg-slate-50 px-3 py-2 text-sm dark:bg-slate-950">
        <span>{{ row.week|date:"M j, Y" }}</span>
        <span class="font-semibold">{{ row.count }}</span>
      </div>
    {% empty %}
      <p class="text-sm text-slate-500 dark:text-slate-400">No date responses yet.</p>
    {% endfor %}
  </div>
</section>
