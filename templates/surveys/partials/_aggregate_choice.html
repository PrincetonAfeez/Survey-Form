<section class="rounded-lg border border-slate-200 bg-white p-5 dark:border-slate-800 dark:bg-slate-900">
  <h2 class="text-lg font-semibold">{{ aggregate.question.text }}</h2>
  <div class="mt-4 space-y-3">
    {% for row in aggregate.rows %}
      <div>
        <div class="mb-1 flex items-center justify-between gap-3 text-sm">
          <span class="font-medium text-slate-700 dark:text-slate-200">{{ row.label }}</span>
          <span class="text-slate-500 dark:text-slate-400">{{ row.count }}</span>
        </div>
        <svg viewBox="0 0 100 8" preserveAspectRatio="none" class="h-2 w-full rounded bg-slate-100 dark:bg-slate-800" aria-hidden="true">
          <rect x="0" y="0" width="{% widthratio row.count aggregate.total 100 %}" height="8" rx="4" class="fill-teal-700"></rect>
        </svg>
      </div>
    {% endfor %}
  </div>
</section>
