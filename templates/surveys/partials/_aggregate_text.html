<section class="rounded-lg border border-slate-200 bg-white p-5 dark:border-slate-800 dark:bg-slate-900">
  <h2 class="text-lg font-semibold">{{ aggregate.question.text }}</h2>
  <p class="mt-1 text-sm text-slate-500 dark:text-slate-400">{{ aggregate.count }} response{{ aggregate.count|pluralize }}{% if aggregate.count > 25 %} (showing latest 25){% endif %}</p>
  <div class="mt-4 space-y-3">
    {% for answer in aggregate.answers %}
      <blockquote class="rounded-md bg-slate-50 p-3 text-sm leading-6 text-slate-700 dark:bg-slate-950 dark:text-slate-200">{{ answer.text_value }}</blockquote>
    {% empty %}
      <p class="text-sm text-slate-500 dark:text-slate-400">No text responses yet.</p>
    {% endfor %}
  </div>
</section>
