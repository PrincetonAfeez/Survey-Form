{% extends "base.html" %}

{% block title %}Resume Link Expired{% endblock %}

{% block content %}
  <section class="max-w-2xl rounded-lg border border-slate-200 bg-white p-7 shadow-sm dark:border-slate-800 dark:bg-slate-900">
    <p class="text-sm font-semibold uppercase tracking-wide text-red-700 dark:text-red-300">Resume unavailable</p>
    <h1 class="mt-3 text-3xl font-semibold tracking-normal">This resume link is invalid or expired</h1>
    <p class="mt-4 text-slate-600 dark:text-slate-300">You can start a fresh response for {{ survey.title }}.</p>
    <form method="post" action="{% url 'surveys:start' survey.slug %}" class="mt-7" hx-confirm="Start over with a new response?">
      {% csrf_token %}
      <input type="hidden" name="force_new" value="1">
      <button type="submit" class="rounded-md bg-teal-700 px-5 py-3 text-sm font-semibold text-white hover:bg-teal-800">Start over</button>
    </form>
  </section>
{% endblock %}
