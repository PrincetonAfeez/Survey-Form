{% extends "base.html" %}

{% block title %}{{ survey.title }}{% endblock %}

{% block content %}
  <section class="max-w-3xl">
    <p class="text-sm font-semibold uppercase tracking-wide text-teal-700 dark:text-teal-300">Survey</p>
    <h1 class="mt-3 text-4xl font-semibold tracking-normal text-slate-950 dark:text-white">{{ survey.title }}</h1>
    {% if survey.intro %}
      <p class="mt-5 text-base leading-7 text-slate-700 dark:text-slate-300">{{ survey.intro }}</p>
    {% endif %}

    <div class="mt-8 flex flex-wrap items-center gap-3">
      <form method="post" action="{% url 'surveys:start' survey.slug %}">
        {% csrf_token %}
        <button type="submit" class="rounded-md bg-teal-700 px-5 py-3 text-sm font-semibold text-white shadow-sm hover:bg-teal-800">Start</button>
      </form>
      {% if existing_response and not existing_response.is_complete %}
        <a href="{% url 'surveys:step' survey.slug existing_response.current_step %}" class="rounded-md border border-slate-300 px-5 py-3 text-sm font-semibold text-slate-700 hover:bg-slate-100 dark:border-slate-700 dark:text-slate-200 dark:hover:bg-slate-900">Continue</a>
      {% endif %}
    </div>
  </section>
{% endblock %}
