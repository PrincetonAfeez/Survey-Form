{% extends "base.html" %}

{% block title %}Survey Complete{% endblock %}

{% block content %}
  <section class="max-w-2xl rounded-lg border border-slate-200 bg-white p-7 shadow-sm dark:border-slate-800 dark:bg-slate-900">
    <p class="text-sm font-semibold uppercase tracking-wide text-teal-700 dark:text-teal-300">Complete</p>
    <h1 class="mt-3 text-3xl font-semibold tracking-normal">Thanks for completing {{ survey.title }}</h1>
    <p class="mt-4 text-slate-600 dark:text-slate-300">Your response has been recorded.</p>
    <a href="{% url 'surveys:list' %}" class="mt-7 inline-flex rounded-md bg-teal-700 px-5 py-3 text-sm font-semibold text-white hover:bg-teal-800">Back to surveys</a>
  </section>
{% endblock %}
