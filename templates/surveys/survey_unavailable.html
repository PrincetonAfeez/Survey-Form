{% extends "base.html" %}

{% block title %}{{ survey.title }}{% endblock %}

{% block content %}
  <section class="max-w-2xl rounded-lg border border-slate-200 bg-white p-7 shadow-sm dark:border-slate-800 dark:bg-slate-900">
    <p class="text-sm font-semibold uppercase tracking-wide text-amber-700 dark:text-amber-300">Survey closed</p>
    <h1 class="mt-3 text-3xl font-semibold tracking-normal">This survey is no longer accepting responses</h1>
    <p class="mt-4 text-slate-600 dark:text-slate-300">
      <strong>{{ survey.title }}</strong> has been unpublished. If you were partway through, your progress cannot be continued here.
    </p>
    <a href="{% url 'surveys:list' %}" class="mt-7 inline-block rounded-md border border-slate-300 px-4 py-2 text-sm font-semibold text-slate-700 hover:bg-slate-100 dark:border-slate-700 dark:text-slate-200 dark:hover:bg-slate-800">Back to surveys</a>
  </section>
{% endblock %}
