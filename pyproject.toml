[project]
name = "survey-form-app"
version = "0.1.0"
description = "HTMX-driven Django survey form app with branching, repositories, and results."
requires-python = ">=3.12"

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["apps", "config"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "DJ"]
ignore = ["DJ001"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.dev"
python_files = ["test_*.py", "*_test.py", "tests.py"]
testpaths = ["apps"]
[tool.coverage.run]
source = ["apps/surveys"]
omit = ["*/migrations/*", "*/tests/*"]

[tool.coverage.report]
fail_under = 100
show_missing = true
skip_covered = false
